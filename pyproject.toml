[project]
name = "dt2-machine-lab"
version = "0.1.0"
description = "Local Digitakt II machine builds and deterministic offline tests"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
